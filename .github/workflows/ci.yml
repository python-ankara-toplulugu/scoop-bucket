---
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  lint:
    name: Lint manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Validate JSON syntax
        run: |
          for file in bucket/*.json; do
            echo "Validating $file..."
            python -m json.tool "$file" > /dev/null
          done
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Run update_manifests tests
        run: python -m unittest discover tests -v
  discover:
    name: Discover packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Find all packages
        id: find
        run: |
          # Get all package names (without .json extension)
          packages=$(
            for f in bucket/*.json; do basename "$f" .json; done \
              | jq -R -s -c 'split("\n") | map(select(length > 0))'
          )
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Found packages: $packages"
  test:
    name: Test ${{ matrix.package }}
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [lint, discover]
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Scoop and dependencies
        shell: pwsh
        run: |
          # Install Scoop
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm get.scoop.sh | iex

          # Add Scoop to PATH for this session
          $env:Path = "$env:USERPROFILE\scoop\shims;$env:Path"

          # Add extras bucket and install pipx
          scoop bucket add extras
          scoop install pipx
          pipx ensurepath
      - name: Add local bucket
        shell: pwsh
        run: |
          # Scoop expects a Git URL for bucket add, so for local testing
          # we manually copy the bucket files to Scoop's bucket directory
          $bucketDir = "$env:USERPROFILE\scoop\buckets\python-ankara-toplulugu"
          New-Item -ItemType Directory -Path "$bucketDir\bucket" -Force
          Copy-Item -Path "${{ github.workspace }}\bucket\*" -Destination "$bucketDir\bucket\" -Recurse
      - name: Install ${{ matrix.package }}
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\scoop\shims;$env:Path"
          scoop install python-ankara-toplulugu/${{ matrix.package }}
      - name: Test ${{ matrix.package }}
        shell: pwsh
        run: |
          # Add Scoop and pipx to PATH
          $env:Path = "$env:USERPROFILE\scoop\shims;$env:USERPROFILE\.local\bin;$env:Path"

          # Test the command
          ${{ matrix.package }} --help
          ${{ matrix.package }} --version
  checkver:
    name: Check versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check all package versions against PyPI
        run: |
          # Reuse the updater in --dry-run mode (it never writes here) so the
          # version-comparison logic lives in exactly one place. Any per-manifest
          # source/network error is annotated by the script (::error::/::warning::);
          # `|| true` keeps a transient PyPI hiccup from failing the PR check.
          summary=$(python scripts/update_manifests.py --dry-run) || true
          echo "$summary"
          if [ -n "$summary" ] && [ "$summary" != "No updates available." ]; then
            echo "::notice::Some packages have version mismatches. Consider updating the manifests."
          fi
