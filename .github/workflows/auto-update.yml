---
name: Update Manifests
on:
  schedule:
    # Run weekly on Mondays at 9:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      package:
        description: "Specific package to update (leave empty for all)"
        required: false
        type: string
      dry_run:
        description: "Dry run (check only, no PR)"
        required: false
        type: boolean
        default: false
jobs:
  update:
    name: Update manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Update manifests
        id: update
        # Inputs are passed via env (never inlined into the shell) to avoid
        # ${{ }} template-injection into the run block.
        env:
          PACKAGE: ${{ inputs.package }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # On a dry run, --dry-run reports without writing (and the PR step
          # below is skipped); otherwise the script bumps the manifests in place
          # and peter-evans opens a PR only if something actually changed.
          args=""
          [ -n "$PACKAGE" ] && args="$PACKAGE"
          [ "$DRY_RUN" = "true" ] && args="$args --dry-run"
          {
            echo 'summary<<SUMMARY_EOF'
            python scripts/update_manifests.py $args
            echo 'SUMMARY_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Create Pull Request
        if: inputs.dry_run != true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update package versions"
          title: "chore: update package versions"
          body: |
            Automated package version updates from PyPI.

            ## Updates
            ${{ steps.update.outputs.summary }}

            ---
            *This PR was automatically created by the update-manifests workflow.*
          branch: auto-update/packages
          delete-branch: true
          labels: automated,dependencies
